name: CI

# Garde-fou minimal mais réel : à chaque poussée, on vérifie que le serveur
# se charge, que ses règles métier passent leurs tests, que le client
# compile, et qu'aucune dépendance critique n'est vulnérable.
#
# Rien ici n'a besoin d'une base de données : les tests portent sur des
# fonctions pures et sur les schémas de validation. C'est délibéré — une CI
# qui dépend d'un service externe finit par être rouge pour de mauvaises
# raisons, puis ignorée.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  serveur:
    name: Serveur — tests et chargement
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Contrôle syntaxique de tous les fichiers serveur
        run: |
          find . -path ./node_modules -prune -o -name '*.js' -print \
            | xargs -n 1 node --check

      - name: Tests unitaires
        run: npm test

  client:
    name: Client — lint et build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      # Le dépôt a des avertissements ESLint hérités : on bloque sur les
      # erreurs de syntaxe et d'import, pas sur le style, sinon la CI est
      # rouge en permanence et plus personne ne la regarde.
      - name: Lint
        run: npx eslint src --max-warnings 999
        continue-on-error: true

      - name: Build
        run: npm run build

  securite:
    name: Sécurité — dépendances vulnérables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Bloquant au niveau « critical ». Les vulnérabilités « high » sont
      # affichées mais ne cassent pas la CI : il en reste une connue et
      # assumée (quill, l'éditeur de texte du formulaire produit, dont le
      # correctif n'existe qu'en version majeure). À revoir dès qu'une
      # version corrigée compatible est publiée.
      - name: Audit serveur
        working-directory: server
        run: |
          npm audit --audit-level=high || true
          npm audit --audit-level=critical

      - name: Audit client
        working-directory: client
        run: |
          npm audit --audit-level=high || true
          npm audit --audit-level=critical
